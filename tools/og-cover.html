<!-- Social share card. Screenshot this at exactly 1200x630 and save it as
     assets/img/og-cover.jpg  (any browser's device-toolbar will do). -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;600&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:'Mukta',system-ui,sans-serif;color:#FFF6E9;
    background:
      radial-gradient(70% 60% at 50% 8%,rgba(240,180,41,.26),transparent 62%),
      radial-gradient(110% 80% at 50% 100%,rgba(123,30,43,.6),transparent 70%),
      linear-gradient(165deg,#180612,#2A0E1E 48%,#1C0715);
    display:grid;place-items:center;text-align:center;position:relative}
  .ring{position:absolute;top:50%;left:50%;translate:-50% -50%;width:760px;height:760px;
    border-radius:50%;border:2px dashed rgba(240,180,41,.22);
    box-shadow:0 0 0 60px rgba(240,180,41,.05) inset}
  .in{position:relative;z-index:1}
  .om{width:96px;height:96px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 34% 30%,#9A2A38,#7B1E2B);
    box-shadow:0 0 0 3px rgba(240,180,41,.6);
    font-family:'Tiro Devanagari Marathi',serif;font-size:52px;color:#F0B429;padding-bottom:6px}
  .mantra{font-family:'Tiro Devanagari Marathi',serif;color:#F0B429;letter-spacing:2px;font-size:22px;margin-bottom:14px}
  h1{font-family:'Tiro Devanagari Marathi',serif;font-size:76px;line-height:1.15;font-weight:400;
    background:linear-gradient(180deg,#FFF3D6 20%,#FFB627 76%,#F26A21);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
  .en{font-size:19px;letter-spacing:5px;text-transform:uppercase;color:#E8C87E;margin-bottom:30px}
  .promise{font-size:26px;color:#FFF6E9}
  .promise b{color:#F0B429}
  .dates{margin-top:26px;font-size:18px;color:rgba(255,246,233,.6);letter-spacing:1px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;
    background:linear-gradient(90deg,#F26A21,#FFB627,#F0B429,#7B1E2B,#F26A21)}
</style></head><body>
<div class="ring"></div>
<div class="in">
  <div class="om">ॐ</div>
  <p class="mantra">॥ श्री गणेशाय नमः ॥</p>
  <h1>श्री गणेश उत्सव मंडळ</h1>
  <p class="en">Ganeshotsav 2026 · Pune</p>
  <p class="promise">Darshan, aarti, prasad — and <b>every rupee to a social cause</b></p>
  <p class="dates">14 September — 25 September 2026</p>
</div>
<div class="bar"></div>
</body></html>
